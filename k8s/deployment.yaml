apiVersion: apps/v1
kind: Deployment
metadata:
  name: hoya-deployment
  labels:
    app: hoya
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hoya
  template:
    metadata:
      labels:
        app: hoya
    spec:
      imagePullSecrets:
        - name: ghcr-login-secret
      containers:
        - name: hoya
          image: ghcr.io/worktools/hoya:pr-aae2140
          ports:
            - containerPort: 3000
          env:
            - name: RUST_LOG
              value: "info"
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
